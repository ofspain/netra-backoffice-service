play.http.parser.maxMemoryBuffer=3MB   # or larger, e.g. 5MB

# This is the main configuration file for the application.
# https://www.playframework.com/documentation/latest/ConfigFile
db.default.driver = org.postgresql.Driver
db.default.url = "jdbc:postgresql://localhost:5432/themisys"
db.default.username = "postgres"
db.default.password = "ofspain86"

# HikariCP settings
db.default.hikaricp.maximumPoolSize = 5
db.default.hikaricp.minimumIdle = 2
db.default.hikaricp.idleTimeout = 30000   # 30s
db.default.hikaricp.maxLifetime = 600000  # 10m

play.modules.enabled += "scalas.modules.ConfigModule"


# Optional: Flyway can use the same
flyway.url = ${db.default.url}
flyway.user = ${db.default.username}
flyway.password = ${db.default.password}
flyway.locations = ["filesystem:conf/db/migration"]
flyway.table = "flyway_schema_backoffice_history"

# S3 configuration
aws.profile=${?AWS_PROFILE}   # resolves from env var AWS_PROFILE if set
aws.region=${?AWS_REGION}    # resolves from env var AWS_REGION if set
aws.s3.bucket=${?AWS_BUCKET}  # resolves from env var AWS_BUCKET if set



# application.conf

# Pac4j Core Configuration
pac4j {
  # Security settings
  security {
    defaultAuthorization = false  # Only secure routes with @Security.Authenticated
  }

  # Session settings (stateless for JWT)
  session {
    store {
      type = "play"  # Use Play's session store
    }
  }
}

# Play Framework Security

play.http.filters = "scalas.Filters"


play.filters.disabled += "org.pac4j.play.filters.SecurityFilter"

play {

  # Session settings
  session {
    # JWT is stateless, but Play still needs session config
    cookieName = "PLAY_SESSION"
    maxAge = null  # Browser session only
    secure = false  # Set to true in production with HTTPS
    httpOnly = true
  }

  # HTTP Context
  http {
    # Important for security headers
    context = "/"

    # Security headers
#    filters {
 #     headers {
        # Enable security headers
  #      frameOptions = "DENY"
  #      xssProtection = "1; mode=block"
  #      contentTypeOptions = "nosniff"
  #      permittedCrossDomainPolicies = "master-only"
  #    }
  #  }
  }
}

# JWT Specific Configuration (if needed)
jwt {
  # Your JWT settings (optional - you're using env variables)
  # issuer = "your-auth-service"
  # audience = "your-app-audience"
  # leeway = 30s
}

# CORS Configuration (if you have web clients)
play.filters.cors {
  allowedOrigins = ["http://localhost:9000", "https://yourdomain.com"]
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Origin", "Content-type", "Authorization", "X-Authorization"]
  preflightMaxAge = 3 days
}

# Logging for Security (recommended)
logger {
  # Pac4j logging
  org.pac4j = INFO
  security = DEBUG

  # Your security package
  security = DEBUG
}

# REST Client Configuration
rest.client {
  timeout = 30000
  maxConnections = 100
  connectionTimeout = 5000
  socketTimeout = 30000
  enableRetry = true
  maxRetries = 3
}

# Service-specific configurations
services {
  external-api {
    baseUrl = "https://api.example.com"
    apiKey = ${?EXTERNAL_API_KEY}
    timeout = 10000
  }

  authrex-path {
    baseUrl = "http://localhost:8080"
    timeout = 5000
    jwtPublicKeyPath = "/api/auth/public-key"
    customerUserRegistrationPath = "/api/identities/registration"
    loginPath = "/api/auth/login"
  }
}



@import scalas.utils.StaticAssets
@()(implicit req: play.mvc.Http.Request)
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login | Themistra</title>
        <link href="@StaticAssets.getUrl("css/bootstrap.min.css")" rel="stylesheet">
        <link href="@StaticAssets.getUrl("/css/admin/custom.css")" rel="stylesheet">
    </head>
    <body class="bg-light">

            <!-- Fixed Navbar -->
        <nav class="navbar navbar-light bg-white shadow-sm fixed-top">
            <div class="container-fluid justify-content-end">
                <a class="navbar-brand d-flex align-items-center" href="/">
                    <img src="@StaticAssets.getUrl("imgs/logo.png")" alt="Themistra" height="36" class="me-2">
                </a>
            </div>
        </nav>

            <!-- Page Content -->
        <div class="container" style="margin-top: 100px;">
            <div class="login-card mt-5">

                <h4 class="text-center">Sign In</h4>

                <form action="@routes.AuthController.login()" method="post">
                    <input type="hidden" name="csrfToken" value="@UtilityController.csrfToken(req)"/>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-themistra">Sign In</button>
                    </div>
                </form>

                    <!-- Footer Links -->
                <div class="login-footer mt-3">
                    <a href="/forgot-password">Forgot Password?</a>
                </div>
            </div>
        </div>
        <script src="@StaticAssets.getUrl("js/bootstrap.bundle.min.js")"></script>
    </body>
</html>
